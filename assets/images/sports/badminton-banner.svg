<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" width="100%" height="100%">
  <defs>
    <linearGradient id="badmintonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f3d3e"/>
      <stop offset="45%" stop-color="#145354"/>
      <stop offset="100%" stop-color="#092526"/>
    </linearGradient>
    <linearGradient id="crimsonAcc" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c81e27"/>
      <stop offset="100%" stop-color="#f43f5e"/>
    </linearGradient>
    <radialGradient id="courtSpot" cx="80%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#10b981" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1440" height="450" fill="url(#badmintonGrad)"/>
  <rect width="1440" height="450" fill="url(#courtSpot)"/>
  
  <!-- Subtle Court Perspective Lines -->
  <g stroke="#ffffff" stroke-opacity="0.1" stroke-width="2.5" fill="none">
    <line x1="0" y1="400" x2="1440" y2="400"/>
    <line x1="200" y1="450" x2="500" y2="280"/>
    <line x1="1240" y1="450" x2="940" y2="280"/>
    <line x1="720" y1="280" x2="720" y2="450"/>
    <rect x="420" y="320" width="600" height="110" rx="8"/>
  </g>

  <!-- Abstract Badminton Racket & Shuttlecock Geometric Motifs -->
  <g transform="translate(1120, 220)" opacity="0.35">
    <circle cx="0" cy="0" r="140" stroke="#ffffff" stroke-width="6" fill="none"/>
    <line x1="-100" y1="-100" x2="100" y2="100" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="100" y1="-100" x2="-100" y2="100" stroke="#ffffff" stroke-width="1.5"/>
    <line x1="0" y1="140" x2="60" y2="260" stroke="#ffffff" stroke-width="12" stroke-linecap="round"/>
  </g>

  <!-- Typography Area -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <rect x="80" y="80" width="170" height="28" rx="14" fill="#c81e27"/>
    <text x="165" y="99" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">OFFICIAL CLUB</text>
    
    <text x="80" y="170" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1.5">Taylor's Badminton Club</text>
    <text x="80" y="215" fill="#a7f3d0" font-size="20" font-weight="500">Weekly Sparring · Clinics & Tournaments · All Levels Welcome</text>
    
    <g transform="translate(80, 270)">
      <rect width="210" height="48" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
      <text x="18" y="22" fill="#ffffff" font-size="14" font-weight="700">SPORTS COMPLEX</text>
      <text x="18" y="38" fill="#94a3b8" font-size="12">Courts 1–4 · Lakeside</text>
      
      <rect x="230" width="180" height="48" rx="12" fill="rgba(255,255,255,0.12)" stroke="rgba(255,255,255,0.2)"/>
      <text x="248" y="22" fill="#ffffff" font-size="14" font-weight="700">WEEKLY SESSIONS</text>
      <text x="248" y="38" fill="#94a3b8" font-size="12">Wednesday & Sunday</text>
    </g>
  </g>
  
  <rect x="0" y="442" width="1440" height="8" fill="url(#crimsonAcc)"/>
</svg>
