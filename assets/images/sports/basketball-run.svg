<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 600" width="100%" height="100%">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#141824"/>
      <stop offset="50%" stop-color="#1b233a"/>
      <stop offset="100%" stop-color="#0d111a"/>
    </linearGradient>
    <radialGradient id="courtGlow" cx="50%" cy="80%" r="60%">
      <stop offset="0%" stop-color="#ea580c" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="rimGlow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#ef4444"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="600" fill="url(#bg)"/>
  <rect width="1200" height="600" fill="url(#courtGlow)"/>
  
  <!-- Court Perspective Lines -->
  <g stroke="#ffffff" stroke-opacity="0.12" stroke-width="2" fill="none">
    <ellipse cx="600" cy="520" rx="360" ry="140"/>
    <ellipse cx="600" cy="520" rx="160" ry="60"/>
    <line x1="600" y1="200" x2="600" y2="600"/>
    <line x1="100" y1="600" x2="480" y2="280"/>
    <line x1="1100" y1="600" x2="720" y2="280"/>
    <line x1="280" y1="420" x2="920" y2="420"/>
  </g>

  <!-- Basketball Silhouette / Geometric Elements -->
  <g transform="translate(600, 260)">
    <circle cx="0" cy="0" r="110" fill="#ea580c" opacity="0.95"/>
    <!-- Ball Ribs -->
    <path d="M-110 0 A110 110 0 0 1 110 0" stroke="#0f172a" stroke-width="6" fill="none"/>
    <path d="M0 -110 A110 110 0 0 1 0 110" stroke="#0f172a" stroke-width="6" fill="none"/>
    <path d="M-78 -78 C-20 -20 -20 20 -78 78" stroke="#0f172a" stroke-width="5" fill="none"/>
    <path d="M78 -78 C20 -20 20 20 78 78" stroke="#0f172a" stroke-width="5" fill="none"/>
    <circle cx="0" cy="0" r="110" stroke="#ffedd5" stroke-width="3" fill="none" opacity="0.4"/>
  </g>

  <!-- Title & Typography Overlays -->
  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <text x="60" y="80" fill="#f97316" font-size="14" font-weight="700" letter-spacing="3">TAYLOR'S BASKETBALL CLUB</text>
    <text x="60" y="140" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1">FRIDAY NIGHT RUNS</text>
    <text x="60" y="180" fill="#94a3b8" font-size="20" font-weight="500">Half-court 3v3 · King of the court · Outdoor Court 2</text>
  </g>
  <rect x="0" y="585" width="1200" height="15" fill="url(#rimGlow)"/>
</svg>
