<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bballGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#18181b"/>
      <stop offset="60%" stop-color="#27272a"/>
      <stop offset="100%" stop-color="#09090b"/>
    </linearGradient>
    <radialGradient id="orangeGlow" cx="80%" cy="40%" r="55%">
      <stop offset="0%" stop-color="#f97316" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="courtStripe" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#f97316"/>
      <stop offset="100%" stop-color="#c81e27"/>
    </linearGradient>
  </defs>
  <rect width="1440" height="450" fill="url(#bballGrad)"/>
  <rect width="1440" height="450" fill="url(#orangeGlow)"/>
  
  <!-- Hardwood Court Geometric Shapes -->
  <g stroke="#ffffff" stroke-opacity="0.08" stroke-width="2" fill="none">
    <circle cx="1100" cy="225" r="180"/>
    <line x1="1100" y1="0" x2="1100" y2="450"/>
    <rect x="850" y="110" width="250" height="230"/>
  </g>

  <g font-family="-apple-system, BlinkMacSystemFont, 'SF Pro Display', sans-serif">
    <rect x="80" y="80" width="170" height="28" rx="14" fill="#ea580c"/>
    <text x="165" y="99" fill="#ffffff" font-size="11" font-weight="700" letter-spacing="1.5" text-anchor="middle">OFFICIAL CLUB</text>
    
    <text x="80" y="170" fill="#ffffff" font-size="52" font-weight="900" letter-spacing="-1.5">Taylor's Basketball Club</text>
    <text x="80" y="215" fill="#fdba74" font-size="20" font-weight="500">Open Runs · Campus League · Skills Development</text>
    
    <g transform="translate(80, 270)">
      <rect width="210" height="48" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="18" y="22" fill="#ffffff" font-size="14" font-weight="700">OUTDOOR COURTS</text>
      <text x="18" y="38" fill="#a1a1aa" font-size="12">Courts 1 & 2 · Lakeside</text>
      
      <rect x="230" width="180" height="48" rx="12" fill="rgba(255,255,255,0.08)" stroke="rgba(255,255,255,0.15)"/>
      <text x="248" y="22" fill="#ffffff" font-size="14" font-weight="700">REGULAR RUNS</text>
      <text x="248" y="38" fill="#a1a1aa" font-size="12">Friday Evenings 7PM</text>
    </g>
  </g>
  
  <rect x="0" y="442" width="1440" height="8" fill="url(#courtStripe)"/>
</svg>
